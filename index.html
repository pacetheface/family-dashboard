<div class="pinbox">
<div class="pinhi">🏡</div>
<div class="pinname">Knapp Family</div>
<div class="pinsub">Enter PIN</div>
<div class="pindots"><i></i><i></i><i></i><i></i></div>
<div class="pinkeys">
<button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
<button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
<button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>

<script>
(function(){
const HASH='eb9cf4c533aed16eebdc067ba1ef6a895e5098ec17a7a4aa8855d1cf496e6847';
const root=document.getElementById('pinlock');
if(document.documentElement.classList.contains('pinok'))return;
let pin='',busy=false;
const dots=[...root.querySelectorAll('.pindots i')];
const paint=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<pin.length));
function unlock(){try{localStorage.setItem('knappUnlocked','1')}catch(e){}document.documentElement.classList.add('pinok')}
async function check(){
busy=true;
let ok=false;
try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));
ok=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')===HASH}catch(e){}
if(ok){unlock();return}
root.classList.remove('bad');void root.offsetWidth;root.classList.add('bad');
setTimeout(()=>{pin='';paint();root.classList.remove('bad');busy=false},420)}
function enter(d){if(busy||pin.length>=4)return;pin+=d;paint();if(pin.length===4)check()}
function back(){if(busy||!pin)return;pin=pin.slice(0,-1);paint()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset.d;if(d==='b')back();else enter(d)});
document.addEventListener('keydown',e=>{
if(document.documentElement.classList.contains('pinok'))return;
if(/^[0-9]$/.test(e.key)){e.preventDefault();enter(e.key)}
else if(e.key==='Backspace'){e.preventDefault();back()}
e.stopPropagation()},true);
})();
</script>

if(!readDone(n)&&d.easy!==2&&n0>=1080)h+=`<div class="grp">🌙 Evening</div>`+check(aKey(n,'EV',0),'📖 Evening reading before bed','June'===n?n:n);}
h+=`<div class="parent"><span>👪 parent:</span><button class="${d.easy===1?'on':''}" onclick="aftEasy('${n}',1)">Easy day 💛</button>${KC(n).SC.length?`<button class="${d.easy===2?'on':''}" onclick="aftEasy('${n}',2)">Skip today</button>`:''}${d.in?`<button onclick="if(confirm('Undo afternoon for ${n}?')){const d=DS('${n}');delete d.in;delete d.land;delete d.screens;save();render()}">undo</button>`:''}</div></div>`;return h}
function aftPages(){const af=mins(nowD())>=720;KIDL.forEach(n=>{const el=document.getElementById('kp-'+n),html=`<div id="ka-${n}"></div>`+aftLists(n);const kh=el.querySelector('.kh');if(af)kh.insertAdjacentHTML('afterend',html+'<div class="divider">🌅 This morning</div>');else el.insertAdjacentHTML('beforeend','<div class="divider">🏠 Afternoon</div>'+html)})}
function compactA(n,i){const n0=mins(nowD()),d=DS(n),ph=aPhase(n);let main,pr=0,lab;
if(ph==='wait'){const T=homeT(n)-n0;main=T>0&&dayType()!=='weekend'?`<div class="cbig">${T>=60?'🏫 '+homeS(n):mmss(T)}</div><div class="csub">${T>=60?'leaving':'until leaving'}</div>`:`<div class="cbig">🚶</div><div class="csub">on the way home${dayType()!=='weekend'?' · '+fmt(-T):''}</div>`;lab=T>0?'leaves '+homeS(n):'🏠 punch in at home';}
else if(ph==='land'){const ks=lKeys(n),dn=ks.filter(k=>S[k]).length,T=tm(d.in)+S.cfg.landMin-n0;main=`<div class="cbig">${T>=10?Math.ceil(T)+' min':mmss(T)}</div><div class="csub">🛬 landing</div>`;pr=dn/ks.length;lab=`🛬 ${dn}/${ks.length} landing`}
else if(ph==='screens'){const L=sList(n),dn=L.filter(x=>S[x[1]]).length;main=`<div class="cbig">🎮 ${dn}/${L.length}</div><div class="csub">before screens</div>`;pr=L.length?dn/L.length:1;lab='🎮 tick to unlock'}
else{main=`<div class="cbig">${KC(n).SC.length?'🎮':'🎉'}</div><div class="csub">${KC(n).SC.length?'screens unlocked':'all done'}</div>`;pr=1;lab='✅ done'}
const p=punched(n);return `<div class="nx cc ${ph==='free'?'doneP':''}" style="${col(n)}" onclick="goPage(${i+1})"><div class="who">${P[n].e} ${n} ›</div>${main}<div class="ring"><i style="width:${pr*100}%"></i></div><div class="csub">${lab}</div>${aftBtn(n,1)}<div class="csub" style="margin-top:6px">🌅 ${p?'✅ '+p.t:mKeys(n).filter(k=>S[k]).length+'/'+mKeys(n).length}</div></div>`}
function activityHTML(){const L=S.log.slice().reverse();return `<h2>🔔 Activity <span class="tag">FOR PARENTS</span></h2><div class="card" style="--c:#999">${L.length?L.map(x=>`<div class="row"><span class="t" style="--c:var(${x.kid?P[x.kid].c:'--ryan'})">${x.time}</span><span>${x.text}${x.date!==today_()?` <span class="sub">${x.date}</span>`:''}</span></div>`).join(''):'<div class="sub">No activity yet today.</div>'}</div>`}
function settingsHTML(){const ta=(v,on)=>`<textarea rows="${Math.max(3,v.length+1)}" onchange="${on}">${v.join('\n')}</textarea>`;
return `<h2>⚙️ Settings <span class="tag">EDITABLE DEFAULTS</span></h2>`+KIDL.map(n=>`<div class="card set" style="${col(n)}"><h3>${P[n].e} ${n}</h3>
<label>🌅 Morning checklist (one per line)</label>${ta(R[n][mkName(n)],`setList('${n}','M',this.value)`)}
<label>🏠 Punch In activates at (leaving ${n==='June'?'Kinderhaus':n==='Jack'?'OGT':'school'})</label><input type="time" value="${homeS(n)}" onchange="S.cfg.kids['${n}'].home=this.value;save();render()">
${n!=='June'?`<label>🎉 Friday: Punch In activates at ${n==='West'?'<span class="tag">SET REAL TIME</span>':''}</label><input type="time" value="${KC(n).homeFri||KC(n).home}" onchange="S.cfg.kids['${n}'].homeFri=this.value;save();render()">`:''}<label>🛬 Landing checklist</label>${ta(KC(n).L,`setList('${n}','L',this.value)`)}
${n!=='June'?`<label>🎮 Before screens (keep 📖 on the reading item)</label>${ta(KC(n).SC,`setList('${n}','SC',this.value)`)}`:''}</div>`).join('')+
`<div class="card set" style="--c:#999"><h3>🔔 Notifications</h3><label>🎉 Friday must-do item (West &amp; Jack)</label><input type="url" value="${S.cfg.whw||'📝 Weekend homework'}" onchange="S.cfg.whw=this.value.trim()||'📝 Weekend homework';save();render()"><label>Landing time allowed (min)</label><input type="number" min="5" max="90" value="${S.cfg.landMin}" onchange="S.cfg.landMin=+this.value||20;save();render()">
<label>Webhook URL (POST JSON per event)</label><input type="url" placeholder="https://…" value="${S.cfg.hook}" onchange="S.cfg.hook=this.value.trim();save()">
<label class="tg"><input type="checkbox" ${S.cfg.hookOn?'checked':''} onchange="S.cfg.hookOn=this.checked;save()"> Send events to webhook (off by default)</label>
<button class="sbtn" onclick="notify('test')">Send test event</button> <button class="sbtn" onclick="if(confirm('Reset all routine lists to defaults?')){S.cfg=JSON.parse(JSON.stringify(CFG_DEF));delete S.Rm;location.reload()}">↺ Reset lists</button></div>`}
function setList(n,t,v){const L=v.split('\n').map(x=>x.trim()).filter(Boolean);if(t==='M'){R[n][mkName(n)]=L;(S.Rm=S.Rm||{})[n]=L}else S.cfg.kids[n][t]=L;save();render()}
setInterval(()=>{if(dailyReset())render()},60000);

function compact(n,i){const n0=mins(nowD()),ks=mKeys(n),d=ks.filter(k=>S[k]).length,p=punched(n),out=anchor(n,'out');let main,cls='';
if(p)main=`<div class="cbig">✅ ${p.t}</div><div class="csub">${p.d<=0?(p.d<0?-p.d+' min early':'on time')+' 🎉':p.d+' min late'}</div>`;
else if(morningCard(n,n0)&&out){const T=tm(out[0])-n0,sec=Math.abs(T*60);cls=T<0?'red':T<10?'amber':'';main=`<div class="cbig">${T<0?'+':''}${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}</div><div class="csub">until ${out[2].toLowerCase()}</div>`}
else{const L=evs(n),e=L.find(e=>tm(e[0])>n0);main=e?`<div class="cbig" style="font-size:26px">${e[1]} ${e[0]}</div><div class="csub">${e[2]}</div>`:`<div class="cbig" style="font-size:26px">🌙</div><div class="csub">Sleep tight</div>`}
return `<div class="nx cc ${cls} ${p?'doneP':''}" style="${col(n)}" onclick="goPage(${i+1})"><div class="who">${P[n].e} ${n} ›</div>${main}<div class="ring"><i style="width:${ks.length?d/ks.length*100:0}%"></i></div><div class="csub">🌅 ${d}/${ks.length} done</div>${punchBtn(n,1)}</div>`}
function punchBtn(n,small){const p=punched(n),L=mKeys(n).filter(k=>!S[k]).length;
if(p)return `<button class="punch pdone ${small?'sm':''}" onclick="event.stopPropagation()">✅ Punched out ${p.t}<small>${p.d<0?-p.d+' min early 🎉':p.d===0?'on time 🎉':p.d+' min late'}</small></button>`;
return `<button class="punch pk ${small?'sm':''} ${L?'wait':''}" style="${col(n)}" onclick="event.stopPropagation();${L?`goPage(${KIDL.indexOf(n)+1})`:`doPunch('${n}')`}">${L?`⏳ ${L} task${L>1?'s':''} left`:"I'm ready! ✅ Punch out"}</button>`}
function nexts(){document.getElementById('nexts').innerHTML=KIDL.map((n,i)=>mins(nowD())>=720?compactA(n,i):compact(n,i)).join('');KIDL.forEach(n=>{const el=document.getElementById('ka-'+n);if(el)el.innerHTML=aftCard(n)+aftBtn(n)});leftHouse();KIDL.forEach(n=>{const el=document.getElementById('kc-'+n);if(el){const mc=morningCard(n,mins(nowD()));el.innerHTML=(mc?'':`<div class="mwin">🌅 ${mKeys(n).every(k=>S[k])?'Morning: done':'Morning window over'}</div>`)+bigCard(n)+punchBtn(n)}})}
function kidPages(){KIDL.forEach(n=>{const el=document.getElementById('kp-'+n);const g=mkName(n),p=punched(n);
el.innerHTML=`<div class="kh" style="${col(n)}"><span class="kname">${P[n].e} ${n}</span><span class="sub">${P[n].d}</span></div><div id="kc-${n}"></div>
<div class="card kl" style="${col(n)}"><h3>🌅 Morning <span class="streak" title="last 7 days">${streak(n)}</span></h3><div class="wtip"></div>
${p?`<div class="mclosed">${pmsg(p)}</div>`:R[n][g].map((it,i)=>check(`r_${n}_${g}_${i}`,it,n)).join('')}</div>`})}
let page=+(Q.get('page')??localStorage.getItem('page')??0);
function goPage(i,smooth=true){page=Math.max(0,Math.min(3,i));localStorage.setItem('page',page);const pg=document.getElementById('pager');pg.scrollTo({left:page*pg.clientWidth,behavior:smooth?'smooth':'auto'});dots()}
function dots(){document.getElementById('dots').innerHTML=`<button class="arr" onclick="goPage(page-1)" ${page?'':'disabled'}>‹</button>`+[['🏠','Home'],...KIDL.map(n=>[P[n].e,n])].map(([e,l],i)=>`<button class="dot ${i===page?'on':''}" style="${i?col(KIDL[i-1]):'--c:#2b2b2b'}" onclick="goPage(${i})">${e}<small>${l}</small></button>`).join('')+`<button class="arr" onclick="goPage(page+1)" ${page<3?'':'disabled'}>›</button>`}
function initPager(){const pg=document.getElementById('pager');let t;pg.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{const i=Math.round(pg.scrollLeft/pg.clientWidth);if(i!==page){page=i;localStorage.setItem('page',page);dots()}},80)});
let sx=null,sy=0;pg.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){sx=e.clientX;sy=e.clientY}});pg.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(e.clientY-sy))goPage(page+(dx<0?1:-1));sx=null});
document.addEventListener('keydown',e=>{if(/INPUT/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')goPage(page+1);if(e.key==='ArrowLeft')goPage(page-1)});
addEventListener('resize',()=>goPage(page,false));dots();requestAnimationFrame(()=>goPage(page,false))}
function tline(){const a=360,b=1290,n0=mins(nowD()),pct=x=>Math.min(100,Math.max(0,(x-a)/(b-a)*100));document.querySelectorAll('.tl').forEach(el=>{const n=el.dataset.n;el.innerHTML=`<div class="past" style="width:${pct(n0)}%"></div>`+evs(n).map(e=>`<span class="ev" style="left:${pct(tm(e[0]))}%" title="${e[0]} ${e[2]}">${e[1]}</span>`).join('')+`<div class="now" style="left:${pct(n0)}%"></div>`})}
function dls(){const n0=mins(nowD());document.querySelectorAll('.dl').forEach(el=>{const[n,g]=el.dataset.k.split('|');const e=anchor(n,GK(g));if(!e){el.style.display='none';return}
if(/Morning/.test(g)&&punched(n)){el.style.display='none';return}const done=R[n][g].every((_,i)=>S[`r_${n}_${g}_${i}`]);const left=tm(e[0])-n0;el.className='dl '+(done?'ok':left<0?'red':left<10?'amber':'');el.textContent=done?`✅ Done before ${e[0]}`:left<0?`⏰ Finish by ${e[0]} · ${fmt(-left)} late`:`⏰ Finish by ${e[0]} (${e[1]} ${e[2]}) · ${fmt(left)} left`})}
function planHTML(){const dt=S.planTab||dayType();return `<h2>🧭 Family day plan <span class="tag">EDITABLE DEFAULTS</span></h2>
<div class="card" style="--c:#999"><div class="seg"><button class="${dt==='weekday'?'on':''}" onclick="S.planTab='weekday';save();render()">🏫 School days</button><button class="${dt==='friday'?'on':''}" onclick="S.planTab='friday';save();render()">🎉 Friday</button><button class="${dt==='weekend'?'on':''}" onclick="S.planTab='weekend';save();render()">🌤️ Weekend</button></div>
${['West','Jack','June'].map(n=>`<div style="${col(n)}"><b style="color:var(${P[n].c})">${P[n].e} ${n}</b><div class="tl" data-n="${n}"></div></div>`).join('')}<div class="hrs"><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span></div></div>
<div class="card" style="--c:#999">${S.plan[dt].map((e,i)=>`<div class="pe"><input type="time" value="${e[0]}" onchange="S.plan['${dt}'][${i}][0]=this.value;save();tick()"><span>${e[1]}</span><input type="text" value="${e[2]}" onchange="S.plan['${dt}'][${i}][2]=this.value;save();tick()"><span class="w">${e[3]===ALL?'Everyone':e[3].replace(/,/g,', ')}</span></div>`).join('')}
<button class="seg" style="margin-top:10px;border:0;border-radius:14px;padding:10px 14px;background:#e8e4dc;font-size:15px" onclick="if(confirm('Reset to defaults?')){S.plan['${dt}']=JSON.parse(JSON.stringify(DEF['${dt}']||DEF.weekday));save();render()}">↺ Reset to defaults</button></div>`}

let WX=JSON.parse(localStorage.getItem('wx')||'null');
const wIcon=c=>c==null?'🌡️':c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=67||(c>=80&&c<=82)?'🌧️':c<=77||c===85||c===86?'❄️':'⛈️';
function wTip(w){if(!w)return'🌦️ Look outside & check the sky';const rain=w.p>=50||(w.c>=51&&w.c<=67)||(w.c>=80&&w.c<=82)||w.c>=95,snow=(w.c>=71&&w.c<=77)||w.c===85||w.c===86;
let t=w.t<5?'Hat & gloves 🧤':w.t<12?'Warm jacket 🧥':w.t<18?'Light jacket 🧥':'T-shirt weather 👕';if(snow)t='Snow boots & gloves ❄️🧤';else if(rain)t='Rain jacket today 🌧️'+(w.t<5?' + gloves 🧤':'');return t}
function walk(){if(!WX)return null;const h=WX.hourly,d=nowD(),day=d.toISOString().slice(0,10);let i=h.time.findIndex(x=>x.startsWith(day+'T07'));if(i<0)i=h.time.findIndex(x=>x.endsWith('T07:00'));if(i<0)return null;
const ii=[i,i+1].filter(k=>h.time[k]);return{t:Math.round(ii.reduce((a,k)=>a+h.temperature_2m[k],0)/ii.length),p:Math.max(...ii.map(k=>h.precipitation_probability[k]??0)),c:Math.max(...ii.map(k=>h.weathercode[k]))}}
function wxRender(){const w=walk(),el=document.getElementById('wx');const cur=WX&&WX.current;const off=!WX?'📡 Weather offline — ':(Date.now()-WX.at>3*3600e3?'⏳ last update '+new Date(WX.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · ':'');
el.innerHTML=`<div class="ic">${wIcon(w&&w.c)}</div><div><div class="tp">${w?w.t+'°':'–'}<span class="sub" style="font-size:15px;font-weight:400"> at walk time 07:00–08:00${w?' · 💧'+w.p+'%':''}</span></div><div class="tip">${wTip(w)}</div><div class="sub" style="font-size:13px">${off}Bad Tölz${cur?' · now '+Math.round(cur.temperature_2m)+'°':''}</div></div>`;
document.querySelectorAll('.wtip').forEach(e=>e.textContent='Today: '+wTip(w))}
function wxFetch(){fetch('https://api.open-meteo.com/v1/forecast?latitude=47.76&longitude=11.56&current=temperature_2m,weathercode&hourly=temperature_2m,precipitation_probability,weathercode&forecast_days=2&timezone=Europe%2FBerlin').then(r=>r.json()).then(j=>{if(!j.hourly)throw 0;WX={at:Date.now(),current:j.current,hourly:j.hourly};localStorage.setItem('wx',JSON.stringify(WX));wxRender();nexts()}).catch(()=>wxRender())}
function tick(){clock();nexts();tline();dls();wxRender()}
if(Q.get('demo')){for(const k in S)if(/^r_/.test(k))delete S[k];S.punch={};const dd=nowD(),past=i=>{const x=new Date(dd);x.setDate(dd.getDate()-i);return dkey(x)};
const tickN=(n,c)=>mKeys(n).slice(0,c).forEach(k=>S[k]=true);
if(Q.get('demo')==='ticks'){tickN('West',2);tickN('Jack',4);tickN('June',1)}
if(Q.get('demo')==='aft'){tickN('West',4);tickN('Jack',5);tickN('June',4);S.punch.West={[dkey(dd)]:{t:'07:06',d:-4}};S.punch.Jack={[dkey(dd)]:{t:'07:09',d:-1}};S.punch.June={[dkey(dd)]:{t:'07:08',d:-2}};S.day={};S.log=[];
const D=S.day[dkey(dd)]={West:{in:'16:05',land:'16:18',left:'07:10'},Jack:{in:'16:12',left:'07:10'},June:{left:'07:10'}};S[aKey('Jack','L',0)]=S[aKey('Jack','L',1)]=true;S[aKey('West','S',0)]=true;
S.log=[['07:06','West','morning_punch_out'],['07:08','June','morning_punch_out'],['07:09','Jack','morning_punch_out'],['07:10','West','left_house'],['16:05','West','punch_in'],['16:12','Jack','punch_in'],['16:18','West','landing_done']].map(([t,n,e])=>({ev:e,kid:n,time:t,date:dkey(dd),text:`${P[n].e} ${n} `+({morning_punch_out:'✅ punched out (morning)',left_house:'🚪 left the house',punch_in:'🏠 punched in – home',landing_done:'🛬 landing done'})[e]}))}
if(Q.get('demo')==='fri'){tickN('West',4);tickN('Jack',5);tickN('June',4);S.punch.West={[dkey(dd)]:{t:'07:05',d:-5}};S.punch.Jack={[dkey(dd)]:{t:'07:08',d:-2}};S.punch.June={[dkey(dd)]:{t:'07:07',d:-3}};S.day={};S.day[dkey(dd)]={West:{in:'13:04',left:'07:10'},Jack:{left:'07:10'},June:{left:'07:10'}};S[aKey('West','L',0)]=S[aKey('West','L',1)]=S[aKey('West','L',2)]=true;S.log=[]}
if(Q.get('demo')==='way'){tickN('West',4);tickN('Jack',5);tickN('June',4);S.punch.West={[dkey(dd)]:{t:'07:06',d:-4}};S.punch.Jack={[dkey(dd)]:{t:'07:09',d:-1}};S.punch.June={[dkey(dd)]:{t:'07:08',d:-2}};S.day={};S.day[dkey(dd)]={West:{in:'16:07',left:'07:10'},Jack:{left:'07:10'},June:{left:'07:10'}};S[aKey('West','L',0)]=true;S.log=[]}
if(Q.get('demo')==='jackpunch'){tickN('Jack',9);S.punch.Jack={[dkey(dd)]:{t:'07:04',d:-6}}}
if(Q.get('demo')==='punch'){tickN('West',9);tickN('Jack',4);tickN('June',4);S.punch.West={[past(1)]:{t:'07:08',d:-2},[past(2)]:{t:'07:12',d:2},[past(5)]:{t:'07:05',d:-5},[past(6)]:{t:'07:09',d:-1},[dkey(dd)]:{t:'07:04',d:-6}};S.punch.June={[dkey(dd)]:{t:'07:02',d:-8}}}
cur='routines'}
render();initPager();wxFetch();setInterval(wxFetch,1800e3);setInterval(()=>{clock();nexts()},1000);setInterval(()=>{nexts();tline();dls()},15000);
</script></body></html>
