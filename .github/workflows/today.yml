name: Today dashboard

on:
  schedule:
    # Weekdays only. 04:15 and 05:15 UTC cover 05:15 and 06:15 Europe/Berlin
    # in winter (CET, UTC+1) and 06:15 and 07:15 in summer (CEST, UTC+2).
    - cron: '15 4 * * 1-5'
    - cron: '15 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build encrypted data/today.json
        env:
          ICAL_WEST: ${{ secrets.ICAL_WEST }}
          ICAL_JACK: ${{ secrets.ICAL_JACK }}
          ICAL_JUNE: ${{ secrets.ICAL_JUNE }}
          ICAL_FAMILY: ${{ secrets.ICAL_FAMILY }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: node scripts/build-today.mjs

      - name: Commit data/today.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          if git diff --cached --quiet; then
            echo "No change to data/today.json"
            exit 0
          fi
          git commit -m "Update encrypted today.json"
          git push
