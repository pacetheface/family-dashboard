name: Today dashboard

on:
  schedule:
    # Every day, 04:15 through 20:15 UTC. That is 05:15–21:15 Europe/Berlin
    # in winter (CET, UTC+1). In summer (CEST, UTC+2) it lands an hour later.
    - cron: '15 4-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A re-run checks out the original commit, which is behind main.
          # Full history lets the later rebase replay onto the latest main.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild data/today.json on latest main and push
        env:
          ICAL_WEST: ${{ secrets.ICAL_WEST }}
          ICAL_JACK: ${{ secrets.ICAL_JACK }}
          ICAL_JUNE: ${{ secrets.ICAL_JUNE }}
          ICAL_FAMILY: ${{ secrets.ICAL_FAMILY }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          node scripts/build-today.mjs
          git add data/today.json
          if git diff --cached --quiet; then
            echo "No change to data/today.json"
            exit 0
          fi
          git commit -m "Update encrypted today.json"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [ "$changed" != "data/today.json" ]; then
            echo "Refusing to push a commit that changes more than data/today.json"
            printf '%s\n' "$changed"
            exit 1
          fi
          attempt=1
          while [ "$attempt" -le 4 ]; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "git push rejected; retrying ($attempt)"
            attempt=$((attempt + 1))
            sleep 2
          done
          echo "git push was rejected after retries"
          exit 1
