name: Recipe index

on:
  push:
    paths:
      - 'recipes/**'
      - 'scripts/recipes.mjs'
      - 'scripts/recipe-book.mjs'
      - '.github/workflows/recipes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipe-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate recipes and rebuild the index and book
        run: |
          node scripts/recipes.mjs
          node scripts/recipe-book.mjs

      - name: Commit generated recipe index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes/index.json recipes/book.html
          if git diff --cached --quiet; then
            echo "Index and book already match the recipes"
            exit 0
          fi
          git commit -m "Update recipe index and book [skip ci]"
          git push
